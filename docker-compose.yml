version: "3.9"

services:
  investbot-backend:
    build: .
    container_name: investbot-backend
    restart: unless-stopped
    env_file:
      - .env
    command: python -m investbot.main

  investbot-frontend:
    build: .
    container_name: investbot-frontend
    restart: unless-stopped
    env_file:
      - .env
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
